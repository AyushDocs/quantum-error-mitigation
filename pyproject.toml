[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum_mitigation"
version = "0.1.0"
description = "A professional library for gate-level and measurement quantum error mitigation"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
    "qiskit>=1.0.0",
    "qiskit-aer>=0.14.0",
    "matplotlib>=3.5",
    "pylatexenc>=2.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=22.0",
    "ipykernel>=6.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["quantum_mitigation*"]
